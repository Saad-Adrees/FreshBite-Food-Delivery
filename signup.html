<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Fresh Bite</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            max-width: 420px;
            margin: 80px auto;
            padding: 35px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .auth-container h2 {
            margin-bottom: 8px;
            color: #1e293b;
        }

        .auth-container p {
            color: #64748b;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-group input:focus {
            outline: none;
            border-color: #ff6b00;
        }

        .btn-full {
            width: 100%;
            padding: 13px;
            background: #ff6b00;
            color: white;
            border: none;
            border-radius: 25px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-full:hover {
            background: #e05e00;
        }

        .auth-footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #64748b;
        }

        .auth-footer a {
            color: #ff6b00;
            text-decoration: none;
            font-weight: 600;
        }

        #alert-box {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 0.9rem;
        }

        .success {
            background: #dcfce7;
            color: #166534;
            display: block !important;
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h2>Create an Account</h2>
        <p>Sign up for free food delivery and exclusive deals</p>

        <div id="alert-box"></div>

        <form id="signup-form">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" required placeholder="name@example.com">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Create a strong password">
            </div>

            <button type="submit" class="btn-full">Sign Up</button>
        </form>

        <div class="auth-footer">
            Already have an account? <a href="login.html">Log In</a>
        </div>
    </div>

    <script>
        document.getElementById("signup-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("fullname").value;
            const alertBox = document.getElementById("alert-box");

            // Show success message
            alertBox.textContent = "Account created for " + name + "! Redirecting to login...";
            alertBox.className = "success";

            // Redirect to login page after 1.5 seconds
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);
        });
    </script>

</body>

</html>
